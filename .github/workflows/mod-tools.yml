name: Mod tools source checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mod-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mod-tools/requirements-dev.txt
      - name: Install source-check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax and source layout
        run: python check_source.py
      - name: Run source tests
        run: python check_source.py --tests

  advanced-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod-tools/tools/devui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mod-tools/tools/devui/web/package-lock.json
      - run: npm ci
      - run: npm run build

# .NET asset builds and native hooks require additional SDKs/tool dependencies.
# Game extraction and mod installation are validated locally; see mod-tools/README.md.
