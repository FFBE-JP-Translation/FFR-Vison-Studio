<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFBE asset collection</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#11151d;color:#e9edf5}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:32px}h1{font-size:30px;margin:0 0 8px}p{color:#aebacc;margin:0 0 20px}button,input,select{font:inherit}button,.link{border:1px solid #41506a;background:#222d40;color:#e9edf5;border-radius:7px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.link:hover{background:#33425c}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #88c9ff;outline-offset:3px}button.active{background:#c4ddff;color:#162236;border-color:#c4ddff}button:disabled{opacity:.4;cursor:default}nav,.controls,.pager{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}input,select{background:#1b2331;color:#fff;border:1px solid #46536b;border-radius:7px;padding:10px}input{flex:1;min-width:230px}label{color:#bdc8d9}.counts{margin-left:auto;color:#aebacc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px}.card{background:#1b2331;border:1px solid #34425a;border-radius:10px;padding:15px;min-width:0}.art{height:250px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#252f40 0% 25%,#2a3547 0% 50%) 50%/24px 24px;border-radius:6px;margin-bottom:12px}.art img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}.name{font-weight:650;overflow-wrap:anywhere;margin-bottom:5px}.id,.meta{font-size:13px;color:#a9b9d2;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.music{display:grid;grid-template-columns:minmax(220px,1fr) 300px 115px;gap:20px;align-items:center;padding:18px;border-bottom:1px solid #34425a}.music:nth-child(odd){background:#1a2230}audio{width:100%;height:34px}.selection{border:1px solid #5675a0;background:#1e2c42;border-radius:10px;padding:18px;margin-top:28px}.selection pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#dbe8ff;font:14px/1.7 ui-monospace,monospace;user-select:all}.hint{font-size:13px}.empty{padding:60px;text-align:center}footer{color:#99a9c1;margin-top:28px;font-size:13px}.pager{justify-content:center}#status{min-height:24px}.badge{color:#f4ce8a;font-size:12px}a{color:#abd2ff}.now{border:1px solid #41506a;padding:14px;border-radius:8px;display:flex;align-items:center;gap:20px}.now audio{max-width:400px}#playingName{flex:1;overflow-wrap:anywhere}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){main{padding:18px}.music{grid-template-columns:1fr}.counts{margin-left:0}.now{flex-wrap:wrap}}
</style>
<style>[hidden]{display:none!important}.now{position:sticky;top:12px;z-index:2;background:#1b2331}</style>
<main>
<h1>FFBE asset collection</h1>
<p>Find the music and enemy you want for the Mitra test battle. Pick one of each, then copy the selection below.</p>
<nav aria-label="Collection"><button id="musicTab" class="active">Music</button><button id="enemyTab">Enemy sprites</button><span class="counts" id="totals"></span></nav>
<div class="controls"><label class="sr" for="search">Search assets</label><input id="search" type="search" placeholder="Search track filename, enemy name or ID…"><label for="sort">Sort</label><select id="sort"><option value="id">Filename / ID</option><option value="name">Name</option></select><button id="clear">Clear search</button></div>
<p class="hint" id="description"></p>
<div class="now" id="now" hidden><span id="playingName">Choose a track</span><audio id="player" controls preload="none"></audio></div>
<div class="pager" id="topPager"></div><div id="results"></div><div class="pager" id="bottomPager"></div>
<section class="selection" aria-label="Your selection"><strong>Your selection</strong><pre id="selection">No music or enemy selected yet.</pre><button id="copy">Copy selection</button><span id="status" role="status" aria-live="polite"></span></section>
<footer id="footer"></footer>
</main>
<script id="data" type="application/json">__ASSET_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
let tab='music',page=0,chosen={};const size=48;
try{chosen=JSON.parse(localStorage.getItem('ffbe-asset-picker-selection')||'{}')}catch{}
const pathURL=p=>p.split('/').map(encodeURIComponent).join('/');
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function button(text,fn){const b=element('button','',text);b.type='button';b.addEventListener('click',fn);return b}
function selection(){const lines=[];if(chosen.music)lines.push('Music: '+chosen.music.id+'\nFile: '+chosen.music.file);if(chosen.enemy)lines.push('Enemy: '+chosen.enemy.id+' — '+chosen.enemy.name+'\nFile: '+chosen.enemy.file);$('selection').textContent=lines.join('\n\n')||'No music or enemy selected yet.';try{localStorage.setItem('ffbe-asset-picker-selection',JSON.stringify(chosen))}catch{}}
function pick(type,item){chosen[type]={id:item.id,name:item.name,file:item.file};selection();$('status').textContent=' Selected '+item.id+'.';setTimeout(()=>$('status').textContent='',2500)}
function play(item){$('now').hidden=false;$('playingName').textContent=item.name;$('player').src=pathURL(item.file);$('player').play().catch(()=>$('status').textContent=' Press play in the audio controls to listen.')}
function render(){const q=$('search').value.toLocaleLowerCase().trim();let rows=data[tab].filter(r=>(r.id+' '+r.name+' '+(r.japanese||'')+' '+r.file).toLocaleLowerCase().includes(q));rows.sort((a,b)=>(a[$('sort').value]||'').localeCompare(b[$('sort').value]||'',undefined,{numeric:true}));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages-1);for(const id of ['topPager','bottomPager']){const p=$(id);p.replaceChildren();const prev=button('← Previous',()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'})}),next=button('Next →',()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})});prev.disabled=page===0;next.disabled=page===pages-1;p.append(prev,element('span','',`${rows.length.toLocaleString()} results · Page ${page+1} of ${pages}`),next)}const list=$('results');list.className=tab==='enemies'?'grid':'';list.replaceChildren();if(!rows.length)list.append(element('div','empty','No matches. Try a shorter name or the numeric ID.'));for(const row of rows.slice(page*size,(page+1)*size)){if(tab==='enemies'){const card=element('article','card'),art=element('a','art');art.href=pathURL(row.file);art.target='_blank';art.rel='noopener';art.title='Open full image';const img=element('img');img.loading='lazy';img.src=pathURL(row.file);img.alt=row.name+' ('+row.id+')';art.append(img);card.append(art,element('div','name',row.name),element('div','id',row.id+(row.japanese?' · '+row.japanese:'')));if(row.atlasOnly)card.append(element('div','badge','Source atlas — idle preview unavailable'));const actions=element('div','actions');actions.append(button('Pick enemy',()=>pick('enemy',row)));if(row.atlas){const a=element('a','link','Sprite sheet');a.href=pathURL(row.atlas);a.target='_blank';a.rel='noopener';actions.append(a)}card.append(actions);list.append(card)}else{const item=element('article','music'),info=element('div');info.append(element('div','name',row.name),element('div','id',row.id),element('div','meta',Math.floor(Math.round(row.seconds)/60)+':'+String(Math.round(row.seconds)%60).padStart(2,'0')+' · '+row.sampleRate.toLocaleString()+' Hz'));const controls=element('div','actions');controls.append(button('▶ Listen',()=>play(row)));const a=element('a','link','Open MP3');a.href=pathURL(row.file);a.target='_blank';a.rel='noopener';controls.append(a);item.append(info,controls,button('Pick music',()=>pick('music',row)));list.append(item)}}$('description').textContent=tab==='music'?'One pass of each local music cue, including crossovers and jingles. Filenames are the game’s labels; official OST titles may differ.':'Composed idle poses with original sheets and animation CSVs in Enemy Sources. Search “Bahamut” to see its forms.';$('musicTab').classList.toggle('active',tab==='music');$('enemyTab').classList.toggle('active',tab==='enemies')}
$('musicTab').onclick=()=>{tab='music';page=0;$('search').value='';render()};$('enemyTab').onclick=()=>{tab='enemies';page=0;$('search').value='';render()};$('search').oninput=()=>{page=0;render()};$('sort').onchange=()=>{page=0;render()};$('clear').onclick=()=>{$('search').value='';page=0;render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('selection').textContent);$('status').textContent=' Copied.'}catch{const range=document.createRange();range.selectNodeContents($('selection'));const s=window.getSelection();s.removeAllRanges();s.addRange(range);$('status').textContent=' Selection highlighted. Press Ctrl+C to copy.'}};
$('totals').textContent=data.music.length.toLocaleString()+' music cues · '+data.enemies.length.toLocaleString()+' enemies';$('footer').textContent='Local collection · '+data.folder+' · '+data.issues+' preparation issues (details in failures.json). The game has not been changed.';selection();render();
</script>
</html>
